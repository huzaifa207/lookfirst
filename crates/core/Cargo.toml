[package]
name = "lookfirst-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.11"
lzma-rs = "0.3.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.2"
tar = "0.4.46"
zip = { version = "9.4.1", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd"] }

[dev-dependencies]
tempfile = "3.27.0"
